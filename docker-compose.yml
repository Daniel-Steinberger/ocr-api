services:
  ocr-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocr-api:latest
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:?set API_KEY in .env}
      TORCH_DEVICE: cuda
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      OCR_API_LOAD_MODELS: "1"
    volumes:
      - hf-cache:/models/hf
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  hf-cache:
